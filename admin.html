<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理审核 - 全国青旅白名单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Noto Serif SC', serif;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-3px);
        }
        
        .status-pending {
            background-color: #fef3c7;
            color: #d97706;
        }
        
        .status-approved {
            background-color: #dcfce7;
            color: #16a34a;
        }
        
        .status-rejected {
            background-color: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white/80 backdrop-blur-sm shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                <h1 class="text-xl font-bold text-amber-800">全国青旅白名单</h1>
            </div>
            <nav class="flex gap-4">
                <a href="index.html" class="px-4 py-2 rounded-lg text-amber-700 hover:text-amber-900 hover:bg-amber-50 font-medium transition-colors">首页地图</a>
                <a href="submit.html" class="px-4 py-2 rounded-lg text-amber-700 hover:text-amber-900 hover:bg-amber-50 font-medium transition-colors">投稿青旅</a>
                <a href="admin.html" class="bg-amber-600 text-white px-4 py-2 rounded-lg hover:bg-amber-700 transition-colors">管理审核</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8" id="main-content">
        <!-- 统计信息 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-amber-600 text-sm">待审核</p>
                        <p class="text-2xl font-bold text-amber-800" id="pending-count">0</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-600 text-sm">已通过</p>
                        <p class="text-2xl font-bold text-green-700" id="approved-count">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="16 10 10 16 8 14"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-red-600 text-sm">已拒绝</p>
                        <p class="text-2xl font-bold text-red-700" id="rejected-count">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选标签 -->
        <div class="flex gap-2 mb-6">
            <button class="filter-btn active bg-amber-600 text-white px-4 py-2 rounded-lg" data-filter="all">全部</button>
            <button class="filter-btn bg-white text-amber-700 px-4 py-2 rounded-lg hover:bg-amber-50" data-filter="pending">待审核</button>
            <button class="filter-btn bg-white text-amber-700 px-4 py-2 rounded-lg hover:bg-amber-50" data-filter="approved">已通过</button>
            <button class="filter-btn bg-white text-amber-700 px-4 py-2 rounded-lg hover:bg-amber-50" data-filter="rejected">已拒绝</button>
        </div>

        <!-- 审核列表 -->
        <div id="hostel-list" class="space-y-4">
            <!-- 青旅卡片将动态生成 -->
        </div>

        <div id="empty-state" class="text-center py-16 text-amber-600">
            <svg class="w-20 h-20 mx-auto mb-4 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>暂无相关青旅记录</p>
        </div>

        <!-- 详情/编辑弹窗 -->
        <div id="detail-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-2xl p-6 max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xl font-bold text-amber-800">青旅详情</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div id="modal-content">
                    <!-- 详情内容将动态生成 -->
                </div>
            </div>
        </div>

        <!-- 编辑表单弹窗 -->
        <div id="edit-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-2xl p-6 max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xl font-bold text-amber-800">编辑青旅信息</h3>
                    <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <form id="edit-form" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">青旅名称</label>
                        <input type="text" id="edit-name" class="w-full px-4 py-2 border border-amber-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">所在省份</label>
                        <select id="edit-province" class="w-full px-4 py-2 border border-amber-200 rounded-lg bg-white">
                            <option value="">请选择省份</option>
                            <option value="北京市">北京市</option>
                            <option value="天津市">天津市</option>
                            <option value="河北省">河北省</option>
                            <option value="山西省">山西省</option>
                            <option value="内蒙古">内蒙古自治区</option>
                            <option value="辽宁省">辽宁省</option>
                            <option value="吉林省">吉林省</option>
                            <option value="黑龙江省">黑龙江省</option>
                            <option value="上海市">上海市</option>
                            <option value="江苏省">江苏省</option>
                            <option value="浙江省">浙江省</option>
                            <option value="安徽省">安徽省</option>
                            <option value="福建省">福建省</option>
                            <option value="江西省">江西省</option>
                            <option value="山东省">山东省</option>
                            <option value="河南省">河南省</option>
                            <option value="湖北省">湖北省</option>
                            <option value="湖南省">湖南省</option>
                            <option value="广东省">广东省</option>
                            <option value="广西">广西壮族自治区</option>
                            <option value="海南省">海南省</option>
                            <option value="重庆市">重庆市</option>
                            <option value="四川省">四川省</option>
                            <option value="贵州省">贵州省</option>
                            <option value="云南省">云南省</option>
                            <option value="西藏">西藏自治区</option>
                            <option value="陕西省">陕西省</option>
                            <option value="甘肃省">甘肃省</option>
                            <option value="青海省">青海省</option>
                            <option value="宁夏">宁夏回族自治区</option>
                            <option value="新疆">新疆维吾尔自治区</option>
                            <option value="香港">香港特别行政区</option>
                            <option value="澳门">澳门特别行政区</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">详细地址</label>
                        <input type="text" id="edit-address" class="w-full px-4 py-2 border border-amber-200 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">简介</label>
                        <textarea id="edit-description" rows="3" class="w-full px-4 py-2 border border-amber-200 rounded-lg resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">入住体验</label>
                        <textarea id="edit-experience" rows="3" class="w-full px-4 py-2 border border-amber-200 rounded-lg resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">特色标签（用逗号分隔）</label>
                        <input type="text" id="edit-tags" class="w-full px-4 py-2 border border-amber-200 rounded-lg" placeholder="如：交通便利,靠近景区">
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-2">图片链接</label>
                        <input type="text" id="edit-image" class="w-full px-4 py-2 border border-amber-200 rounded-lg" placeholder="输入图片URL">
                    </div>
                    <div class="flex gap-3">
                        <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg">取消</button>
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-lg">保存修改</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="mt-16 text-center text-amber-600/70 text-sm">
            <p>全国青旅白名单 - 分享旅途美好</p>
        </footer>
    </main>

    <script>
        const API_BASE_URL = window.API_BASE_URL || 'http://localhost:3001/api';
        let currentFilter = 'all';
        let editingHostel = null;
        let adminToken = localStorage.getItem('adminToken') || '';
        
        async function apiRequest(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            };
            if (adminToken) {
                headers.Authorization = `Bearer ${adminToken}`;
            }
            const response = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
            if (response.status === 401) {
                adminToken = '';
                localStorage.removeItem('adminToken');
                throw new Error('未登录或登录已失效');
            }
            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.message || '请求失败');
            }
            if (response.status === 204) return null;
            return response.json();
        }
        
        // 验证密码
        async function validatePassword(callback) {
            try {
                if (!adminToken) {
                    const username = prompt('请输入管理员账号：');
                    if (!username) return;
                    const password = prompt('请输入管理员密码：');
                    if (!password) return;
                    const loginData = await apiRequest('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });
                    adminToken = loginData.token;
                    localStorage.setItem('adminToken', adminToken);
                }
                await callback();
            } catch (err) {
                alert(err.message || '验证失败');
            }
        }

        // 初始化页面
        async function initPage() {
            const hostels = await apiRequest('/admin/hostels');
            localStorage.setItem('hostels', JSON.stringify(hostels));
            updateStats();
            renderList();
        }

        // 获取统计数据
        function updateStats() {
            const hostels = JSON.parse(localStorage.getItem('hostels') || '[]');
            const pending = hostels.filter(h => h.status === 'pending').length;
            const approved = hostels.filter(h => h.status === 'approved').length;
            const rejected = hostels.filter(h => h.status === 'rejected').length;
            
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('approved-count').textContent = approved;
            document.getElementById('rejected-count').textContent = rejected;
        }

        // 获取状态标签
        function getStatusLabel(status) {
            const labels = {
                pending: '待审核',
                approved: '已通过',
                rejected: '已拒绝'
            };
            return labels[status] || status;
        }

        // 渲染青旅卡片
        function renderHostelCard(hostel) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-md p-4 card-hover';
            
            card.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-24 h-24 rounded-lg overflow-hidden flex-shrink-0">
                        <img src="${hostel.images && hostel.images[0] ? hostel.images[0] : 'https://neeko-copilot.bytedance.net/api/text2image?prompt=cozy%20youth%20hostel%20interior%20warm%20atmosphere&image_size=landscape_16_9'}" 
                             alt="${hostel.name}" 
                             class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between mb-2">
                            <h4 class="font-bold text-amber-800 truncate">${hostel.name}</h4>
                            <span class="status-${hostel.status} text-xs px-2 py-1 rounded-full">${getStatusLabel(hostel.status)}</span>
                        </div>
                        <p class="text-gray-500 text-sm mb-1 flex items-center gap-1">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            ${hostel.province || '未选择省份'} - ${hostel.address || '暂无地址'}
                        </p>
                        <p class="text-gray-600 text-sm line-clamp-2 mb-3">${hostel.description || '暂无简介'}</p>
                        <div class="flex flex-wrap gap-1 mb-3">
                            ${hostel.tags && hostel.tags.length > 0 ? hostel.tags.map(tag => `<span class="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded-full">${tag}</span>`).join('') : '<span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded-full">暂无标签</span>'}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="viewDetail(${hostel.id})" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-lg text-sm hover:bg-amber-200">查看详情</button>
                            <button onclick="editHostel(${hostel.id})" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-blue-600">编辑</button>
                            ${hostel.status === 'pending' ? `
                                <button onclick="approveHostel(${hostel.id})" class="bg-green-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-green-600">通过</button>
                                <button onclick="rejectHostel(${hostel.id})" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-600">拒绝</button>
                            ` : ''}
                            <button onclick="deleteHostel(${hostel.id})" class="bg-gray-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-gray-600">删除</button>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        // 渲染列表
        function renderList() {
            const hostels = JSON.parse(localStorage.getItem('hostels') || '[]');
            const filteredHostels = hostels.filter(h => {
                if (currentFilter === 'all') return true;
                return h.status === currentFilter;
            });
            
            const list = document.getElementById('hostel-list');
            const emptyState = document.getElementById('empty-state');
            
            if (filteredHostels.length === 0) {
                list.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                list.innerHTML = '';
                filteredHostels.forEach(hostel => {
                    list.appendChild(renderHostelCard(hostel));
                });
            }
        }

        // 查看详情
        function viewDetail(id) {
            const hostels = JSON.parse(localStorage.getItem('hostels') || '[]');
            const hostel = hostels.find(h => h.id === id);
            
            if (hostel) {
                document.getElementById('modal-content').innerHTML = `
                    <div class="mb-4">
                        <img src="${hostel.images && hostel.images[0] ? hostel.images[0] : 'https://neeko-copilot.bytedance.net/api/text2image?prompt=cozy%20youth%20hostel%20interior%20warm%20atmosphere&image_size=landscape_16_9'}" 
                             alt="${hostel.name}" 
                             class="w-full h-40 object-cover rounded-lg">
                    </div>
                    <div class="space-y-3">
                        <div>
                            <p class="text-amber-600 text-sm">青旅名称</p>
                            <p class="font-medium">${hostel.name}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">所在省份</p>
                            <p>${hostel.province || '未选择省份'}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">详细地址</p>
                            <p>${hostel.address || '暂无地址'}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">简介</p>
                            <p>${hostel.description || '暂无简介'}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">入住体验</p>
                            <p>${hostel.experience || '暂无体验分享'}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">特色标签</p>
                            <div class="flex flex-wrap gap-1">
                                ${hostel.tags && hostel.tags.length > 0 ? hostel.tags.map(tag => `<span class="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded-full">${tag}</span>`).join('') : '<span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded-full">暂无标签</span>'}
                            </div>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">提交时间</p>
                            <p>${new Date(hostel.createdAt).toLocaleString('zh-CN')}</p>
                        </div>
                        <div>
                            <p class="text-amber-600 text-sm">状态</p>
                            <span class="status-${hostel.status} text-sm px-2 py-1 rounded-full">${getStatusLabel(hostel.status)}</span>
                        </div>
                    </div>
                `;
                document.getElementById('detail-modal').style.display = 'flex';
            }
        }

        // 编辑青旅
        function editHostel(id) {
            validatePassword(() => {
                const hostels = JSON.parse(localStorage.getItem('hostels') || '[]');
                editingHostel = hostels.find(h => h.id === id);
                
                if (editingHostel) {
                    document.getElementById('edit-id').value = editingHostel.id;
                    document.getElementById('edit-name').value = editingHostel.name;
                    document.getElementById('edit-province').value = editingHostel.province || '';
                    document.getElementById('edit-address').value = editingHostel.address || '';
                    document.getElementById('edit-description').value = editingHostel.description || '';
                    document.getElementById('edit-experience').value = editingHostel.experience || '';
                    document.getElementById('edit-tags').value = editingHostel.tags ? editingHostel.tags.join(',') : '';
                    document.getElementById('edit-image').value = editingHostel.images && editingHostel.images[0] ? editingHostel.images[0] : '';
                    document.getElementById('edit-modal').style.display = 'flex';
                }
            });
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        // 关闭编辑弹窗
        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            editingHostel = null;
        }

        // 保存编辑
        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const hostels = JSON.parse(localStorage.getItem('hostels') || '[]');
            const updatedHostels = hostels.map(h => {
                if (h.id === parseInt(document.getElementById('edit-id').value)) {
                    const tags = document.getElementById('edit-tags').value 
                        ? document.getElementById('edit-tags').value.split(',').map(t => t.trim()).filter(t => t)
                        : [];
                    const imageUrl = document.getElementById('edit-image').value || (h.images && h.images[0]);
                    
                    return {
                        ...h,
                        name: document.getElementById('edit-name').value,
                        province: document.getElementById('edit-province').value,
                        address: document.getElementById('edit-address').value,
                        description: document.getElementById('edit-description').value,
                        experience: document.getElementById('edit-experience').value,
                        tags: tags,
                        images: imageUrl ? [imageUrl] : h.images
                    };
                }
                return h;
            });
            
            const updated = updatedHostels.find(h => h.id === parseInt(document.getElementById('edit-id').value));
            try {
                await apiRequest(`/admin/hostels/${updated.id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        name: updated.name,
                        province: updated.province,
                        address: updated.address,
                        description: updated.description,
                        experience: updated.experience,
                        story: updated.story || '',
                        tags: updated.tags || [],
                        images: updated.images || []
                    })
                });
                const hostels = await apiRequest('/admin/hostels');
                localStorage.setItem('hostels', JSON.stringify(hostels));
                closeEditModal();
                updateStats();
                renderList();
            } catch (err) {
                alert(err.message || '保存失败');
            }
        });

        // 通过审核
        function approveHostel(id) {
            validatePassword(async () => {
                if (confirm('确定要通过这家青旅的审核吗？')) {
                    await apiRequest(`/admin/hostels/${id}/status`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: 'approved' })
                    });
                    const hostels = await apiRequest('/admin/hostels');
                    localStorage.setItem('hostels', JSON.stringify(hostels));
                    updateStats();
                    renderList();
                }
            });
        }

        // 拒绝审核
        function rejectHostel(id) {
            validatePassword(async () => {
                if (confirm('确定要拒绝这家青旅的审核吗？')) {
                    await apiRequest(`/admin/hostels/${id}/status`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: 'rejected' })
                    });
                    const hostels = await apiRequest('/admin/hostels');
                    localStorage.setItem('hostels', JSON.stringify(hostels));
                    updateStats();
                    renderList();
                }
            });
        }

        // 删除青旅
        function deleteHostel(id) {
            validatePassword(async () => {
                if (confirm('确定要删除这家青旅吗？此操作不可恢复。')) {
                    await apiRequest(`/admin/hostels/${id}`, { method: 'DELETE' });
                    const hostels = await apiRequest('/admin/hostels');
                    localStorage.setItem('hostels', JSON.stringify(hostels));
                    updateStats();
                    renderList();
                }
            });
        }

        // 筛选
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-amber-600', 'text-white');
                    b.classList.add('bg-white', 'text-amber-700');
                });
                btn.classList.remove('bg-white', 'text-amber-700');
                btn.classList.add('active', 'bg-amber-600', 'text-white');
                
                currentFilter = btn.getAttribute('data-filter');
                renderList();
            });
        });

        // 点击弹窗外部关闭
        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await validatePassword(async () => {
                await initPage();
            });
        });
    </script>
</body>
</html>
